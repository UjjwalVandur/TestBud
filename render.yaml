services:
  - type: web
    name: testbud-api
    env: docker
    dockerfilePath: ./Dockerfile
    region: ohio
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: AUTO_MIGRATE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://testbud.me,https://www.testbud.me,http://localhost:3000"
      - key: CLERK_SECRET_KEY
        sync: false
